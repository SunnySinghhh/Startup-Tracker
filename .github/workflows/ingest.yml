name: Ingest signals

# The scheduled run is what turns this from a snapshot into a tracker: each run
# appends one observation per company, and the momentum model needs that history
# before it can say anything meaningful.
on:
  schedule:
    # 06:15 UTC daily. Deliberately not on the hour — GitHub's scheduler is
    # heavily contended at :00 and jobs get delayed or dropped.
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      edgar_limit:
        description: 'Companies to check against SEC EDGAR'
        required: false
        default: '400'
      github_limit:
        description: 'GitHub orgs to enrich'
        required: false
        default: '60'

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline
        working-directory: pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run ingestion
        working-directory: pipeline
        env:
          # SEC requires a contact address in the User-Agent and will block
          # traffic without one. Set this as a repository variable.
          TRACKER_CONTACT_EMAIL: ${{ vars.TRACKER_CONTACT_EMAIL }}
          # Raises the GitHub API limit from 60/hr to 5,000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m tracker.cli ingest \
            --edgar --edgar-limit "${{ inputs.edgar_limit || 400 }}" \
            --github --github-limit "${{ inputs.github_limit || 60 }}"

      - name: Commit new observations
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo "No new data this run."
            exit 0
          fi
          git commit -m "data: observations for $(date -u +%Y-%m-%d)"
          # The scheduled job races nothing but itself; rebase covers the case
          # where a manual push landed while this run was in flight.
          git pull --rebase --autostash origin main
          git push
