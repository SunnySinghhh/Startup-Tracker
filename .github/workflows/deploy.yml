name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-flight; let the queued one follow it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pipeline
        working-directory: pipeline
        run: pip install -e .

      # The site's JSON is derived, not committed — rebuilding it here keeps
      # the deployed data in lockstep with whatever is in data/ on this commit.
      - name: Build data bundles
        working-directory: pipeline
        run: |
          python -m tracker.cli build
          python -m tracker.cli export

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build site
        working-directory: web
        env:
          # Project Pages are served from /<repo>/, so the asset base path has
          # to match the repository name. Reading it from the event keeps this
          # correct if the repo is renamed.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
